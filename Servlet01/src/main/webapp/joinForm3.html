<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      "
    >
      <h2>회원가입</h2>
    </div>
    <hr />
    <div style="display: flex; flex-direction: column; align-items: center">
      <form method="get" action="refresh01">
        <table>
          <tr>
            <td>성명</td>
            <td><input type="text" name="name" /></td>
          </tr>
          <tr>
            <td>ID</td>
            <td><input type="text" name="id" size="15" /></td>
          </tr>
          <tr>
            <td>비밀번호</td>
            <td><input type="password" name="password" size="15" /></td>
          </tr>
          <tr>
            <td>휴대폰 번호</td>
            <td>
              <input type="text" name="phone" size="5" /> -
              <input type="text" name="phone" size="7" /> -
              <input type="text" name="phone" size="7" />
            </td>
          </tr>
          <tr>
            <td>학년</td>
            <td>
              <input type="radio" name="year" value="1" />1학년
              <input type="radio" name="year" value="2" />2학년
              <input type="radio" name="year" value="3" />3학년
              <input type="radio" name="year" value="4" />4학년
            </td>
          </tr>
          <tr>
            <td>관심분야</td>
            <td>
              <input type="checkbox" name="interest" value="웹 프로그래밍" />웹
              프로그래밍
              <input type="checkbox" name="interest" value="파이썬" />파이썬
              <input type="checkbox" name="interest" value="빅데이터" />빅데이터
              <input
                type="checkbox"
                name="interest"
                value="자바 프로그래밍"
              />자바 프로그래밍
            </td>
          </tr>
          <tr>
            <td>학과</td>
            <td>
              <select name="department">
                <option value="선택하세요" selected>선택하세요</option>
                <option value="컴퓨터소프트웨어공학과">
                  컴퓨터소프트웨어공학과
                </option>
              </select>
            </td>
          </tr>
        </table>
        <div
          style="
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 20px;
            gap: 4px;
          "
        >
          <input type="submit" value="완료" />
          <input type="reset" value="취소" />
        </div>
      </form>
    </div>
  </body>
</html>
